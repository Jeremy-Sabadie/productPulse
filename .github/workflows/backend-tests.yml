name: ProductPulse Backend JUnit

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: productpulse
          MARIADB_USER: productpulse
          MARIADB_PASSWORD: ci_test_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Tests JUnit et couverture JaCoCo
        working-directory: backend
        env:
          DB_PASSWORD: ci_test_password
        run: bash ./mvnw --batch-mode test

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn

  coverage:
    name: Couverture JaCoCo 100 %
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: productpulse
          MARIADB_USER: productpulse
          MARIADB_PASSWORD: ci_test_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Vérifier la couverture JaCoCo
        working-directory: backend
        env:
          DB_PASSWORD: ci_test_password
        run: bash ./mvnw --batch-mode verify

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
