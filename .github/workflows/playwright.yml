name: ProductPulse Playwright

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Generate test JWT keys
        run: |
          mkdir -p frontEnd/tests/fixtures/keys
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out frontEnd/tests/fixtures/keys/private.pem
          openssl rsa \
            -in frontEnd/tests/fixtures/keys/private.pem \
            -pubout \
            -out frontEnd/tests/fixtures/keys/public.pem

      - name: Start Spring Boot API
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3309/productpulse_test
          SPRING_DATASOURCE_USERNAME: productpulse_test
          SPRING_DATASOURCE_PASSWORD: test_password_local
          PRODUCTPULSE_JWT_ISSUER: https://auth.my-popote.example
          PRODUCTPULSE_ADMIN_USER_IDS: '42'
        run: |
          export PRODUCTPULSE_JWT_PUBLIC_KEY="$(cat frontEnd/tests/fixtures/keys/public.pem)"
          nohup ./backend/mvnw -B -f backend/pom.xml spring-boot:run \
            > /tmp/productpulse-api.log 2>&1 < /dev/null &
          echo $! > /tmp/productpulse-api.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 90); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/api/admin/feedback || true)
            if [ "$status" = "401" ]; then
              echo "Spring Boot API ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/productpulse-api.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontEnd
        run: npm ci

      - name: Install Chromium
        working-directory: frontEnd
        run: npx playwright install --with-deps chromium

      - name: Build Angular
        working-directory: frontEnd
        run: npm run build

      - name: Run 9 Playwright tests
        working-directory: frontEnd
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontEnd/playwright-report/
          retention-days: 7

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: productpulse-api-logs
          path: /tmp/productpulse-api.log
          if-no-files-found: ignore

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down
