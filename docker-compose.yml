services:
  db:
    image: mariadb:11.8
    container_name: productpulse-db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: productpulse
      MARIADB_USER: productpulse
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3308:3306"

    volumes:
      - productpulse_db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  productpulse_db_data: